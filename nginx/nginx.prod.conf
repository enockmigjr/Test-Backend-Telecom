# ============================================================
# Nginx — Reverse Proxy PRODUCTION (HTTPS)
# Domaines attendus :
#   ticketing.example.com        → BFF frontend interne (port 3007 hôte / 3000 interne)
#   portail.ticketing.example.com → portail demandeur public
#   auth.example.com             → Keycloak (KC_PROXY=edge)
# Certificats : certs/fullchain.pem + certs/privkey.pem
# Adapter les server_name au domaine réel via le fichier .env (KEYCLOAK_HOSTNAME,
# PUBLIC_APP_ORIGIN, etc.) ou en remplaçant directement les server_name ci-dessous.
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout combined;
    error_log  stderr warn;

    # Si X-Correlation-Id n'est pas fourni, utiliser $request_id
    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss;

    client_body_buffer_size     128k;
    client_max_body_size        10m;
    proxy_request_buffering     on;
    proxy_buffering             on;
    proxy_buffers               8 16k;
    proxy_busy_buffers_size     32k;
    proxy_read_timeout          60s;
    proxy_send_timeout          60s;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    upstream api_upstream {
        server api:3000;
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream public_frontend_upstream {
        server public-frontend:3100;
    }

    upstream keycloak_upstream {
        server keycloak:8080;
    }

    # Redirection HTTP → HTTPS
    server {
        listen 80;
        server_name ticketing.example.com portail.ticketing.example.com auth.example.com;
        return 301 https://$host$request_uri;
    }

    # ============================================================
    # Console opérationnelle (frontend interne / BFF)
    # ============================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name ticketing.example.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $correlation_id;
        add_header X-Correlation-Id $correlation_id always;

        # URLs de rapport signées : ne jamais les journaliser.
        location ^~ /api/v1/reports/public/ {
            access_log off;
            proxy_pass http://api_upstream;
        }

        # Rate limiting strict pour login
        location /api/v1/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://api_upstream;
        }

        # WebSocket interne
        location /socket.io/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # Le BFF frontend proxifie /api/v1 et /api/auth/* en interne ;
        # le reste (pages, assets) est servi par le BFF lui-même.
        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://frontend_upstream;
        }
    }

    # ============================================================
    # Portail demandeur public
    # ============================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name portail.ticketing.example.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location /socket.io/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location / {
            proxy_pass http://public_frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $correlation_id;
        }
    }

    # ============================================================
    # Keycloak (KC_PROXY=edge : reconstruit l'URL depuis les headers)
    # ============================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name auth.example.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;

        location / {
            proxy_pass http://keycloak_upstream;
            proxy_read_timeout 120s;
        }
    }
}
