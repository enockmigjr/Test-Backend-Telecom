# ============================================================
# Prometheus — Règles d'Alerte
# ============================================================
# Les runbook_url ci-dessous pointent vers Grafana (port 3001).
#
# Pour la production :
#   - Remplacer localhost:3001 par votre URL Grafana réelle
#   - ex: https://grafana.votre-domaine.com/d/telecom-application
# ============================================================

groups:
  - name: telecom-alerts
    rules:
      # ─── API ──────────────────────────────────────────────
      - alert: ApiDown
        expr: up{job="telecom-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: telecom-api
          team: oncall
        annotations:
          summary: '🚨 CRITICAL: API NestJS Telecom Indisponible'
          description: "L'instance de l'API NestJS ({{ $labels.instance }}) ne répond plus aux requêtes Prometheus depuis 2 minutes (statut DOWN).\n\n**Impact :** Interruption totale du service de gestion des tickets d'incidents. Les équipes Customer Care et NOC ne peuvent plus accéder à la plateforme.\n\n**Action immédiate requise :** Inspecter l'état du conteneur en exécutant `docker logs telecom-api` et redémarrer le service avec `docker compose restart api`."
          runbook_url: 'http://localhost:3001/d/telecom-application' # Prod: votre URL Grafana
          action: "1. Vérifier `docker logs telecom-api`\n2. Vérifier `docker compose ps api`\n3. Redémarrer avec `docker compose restart api` si nécessaire"

      - alert: HighErrorRate
        expr: rate(telecom_http_requests_total{status_code=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          service: telecom-api
          team: backend
        annotations:
          summary: "🔥 CRITICAL: Taux d'erreur 5xx élevé (>5%)"
          description: "Le taux de réponses en erreur 500 (erreurs serveurs internes) sur la route {{ $labels.route }} de l'instance {{ $labels.instance }} a dépassé le seuil critique de 5% (actuel: {{ $value | humanizePercentage }}).\n\n**Impact :** Les utilisateurs subissent des échecs de traitement sur leurs requêtes. Risque de perte de données ou d'incohérence d'état.\n\n**Action immédiate requise :** Naviguer dans les logs agrégés Loki sur Grafana, filtrer par route et code statut, identifier les correlationId des requêtes en échec pour remonter à la stacktrace exacte."
          runbook_url: 'http://localhost:3001/d/telecom-application' # Prod: votre URL Grafana
          action: "1. Vérifier les logs d'erreur dans Grafana → Loki\n2. Filtrer par correlationId affecté\n3. Vérifier PostgreSQL: `docker logs telecom-postgres`"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(telecom_http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          service: telecom-api
          team: backend
        annotations:
          summary: '⚡ WARNING: Latence P95 excessive (>2s)'
          description: "95% des requêtes vers la route {{ $labels.route }} mettent plus de 2 secondes à répondre (actuel: {{ $value }}s).\n\n**Impact :** Dégradation significative de l'expérience utilisateur (lenteur ressentie). Risque de timeouts en cascade sur les clients HTTP et les proxies.\n\n**Action requise :** Analyser les traces distribuées dans Tempo pour isoler le goulot d'étranglement (requête SQL lente via Drizzle, latence réseau Redis, ou surcharge CPU)."
          runbook_url: 'http://localhost:3001/d/telecom-application' # Prod: votre URL Grafana
          action: "1. Vérifier les requêtes lentes dans Tempo (Grafana → Explore → Tempo)\n2. Vérifier les connexions DB: `telecom_db_pool_connections`\n3. Vérifier Redis: `docker logs telecom-redis`"

      # ─── SLA ──────────────────────────────────────────────
      - alert: SlaBreachRate
        expr: rate(telecom_sla_breaches_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          service: telecom-api
          team: support
        annotations:
          summary: '⏰ WARNING: Violations de SLA détectées'
          description: "Au moins {{ $value }} violations de SLA (débordement de l'heure d'échéance de résolution) ont été enregistrées sur les 15 dernières minutes pour les tickets de priorité {{ $labels.priority }}.\n\n**Impact :** Non-respect des engagements contractuels (SLA). Dégradation de l'indice de satisfaction client.\n\n**Action requise :** Ouvrir le dashboard business Grafana, identifier les tickets actifs en état critique ou d'escalade imminente, et les réassigner immédiatement à des agents disponibles pour traitement."
          runbook_url: 'http://localhost:3001/d/telecom-business' # Prod: votre URL Grafana
          action: "1. Vérifier le dashboard business pour les tickets en souffrance\n2. Réaffecter les tickets non traités\n3. Escalader si nécessaire"

      # ─── Base de Données ──────────────────────────────────
      - alert: HighDbConnections
        expr: telecom_db_pool_connections > 15
        for: 5m
        labels:
          severity: warning
          service: postgresql
          team: backend
        annotations:
          summary: '📊 WARNING: Nombre élevé de connexions PostgreSQL'
          description: "Le pool de connexions à PostgreSQL compte actuellement {{ $value }} connexions actives simultanées, ce qui approche de la limite du pool.\n\n**Impact :** Risque de rejet de connexions si la charge augmente, entraînant des erreurs 500 sur les requêtes HTTP de l'API.\n\n**Action requise :** Vérifier les sessions PostgreSQL actives en exécutant `SELECT state, count(*) FROM pg_stat_activity GROUP BY state;` pour identifier d'éventuelles connexions orphelines ou non libérées par l'ORM."
          runbook_url: 'http://localhost:3001/d/telecom-application' # Prod: votre URL Grafana
          action: "1. Vérifier les sessions actives: `SELECT count(*) FROM pg_stat_activity;`\n2. Identifier les connexions idle: `SELECT * FROM pg_stat_activity WHERE state = 'idle';`"

      # ─── Système ──────────────────────────────────────────
      - alert: HighMemoryUsage
        expr: telecom_nodejs_heap_bytes_used_bytes / telecom_nodejs_heap_bytes_total_bytes > 0.9
        for: 10m
        labels:
          severity: warning
          service: telecom-api
          team: backend
        annotations:
          summary: '💾 WARNING: Utilisation critique de la Heap Mémoire Node.js (>90%)'
          description: "L'application NestJS utilise {{ $value | humanizePercentage }} de l'espace heap mémoire alloué à Node.js de manière continue depuis 10 minutes.\n\n**Impact :** Risque imminent de plantage du processus NestJS pour dépassement de mémoire (Out Of Memory - OOM).\n\n**Action requise :** Lancer une analyse de fuite mémoire. Si nécessaire, forcer le recyclage du conteneur avec `docker compose restart api` pour libérer la heap en attendant un correctif."
          runbook_url: 'http://localhost:3001/d/telecom-application' # Prod: votre URL Grafana
          action: "1. Vérifier les fuites mémoire via le dashboard\n2. Redémarrer l'API si nécessaire: `docker compose restart api`"
