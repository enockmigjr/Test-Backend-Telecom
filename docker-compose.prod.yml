# ============================================================================
# Compose production (HTTPS via nginx + images publiées sur un registry).
# Usage :
#   docker compose -f docker-compose.prod.yml up -d --build
# Prérequis : certs/privkey.pem + certs/fullchain.pem (ou mappez vos certificats),
#             variables d'env de production (voir .env.example).
# ============================================================================
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telecom_secret}
      POSTGRES_DB: ${POSTGRES_DB:-telecom_tickets}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U telecom -d telecom_tickets']
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [telecom-network]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks: [telecom-network]

  clamav:
    image: clamav/clamav:1.4.5-debian
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'clamdscan --ping 1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks: [telecom-network]

  keycloak:
    build:
      context: ./keycloak-theme
      dockerfile: Dockerfile
    image: ${REGISTRY:-registry.example.com}/telecom-keycloak:${TAG:-latest}
    restart: unless-stopped
    command: ["start", "--import-realm", "--http-port=8080", "--hostname=${KEYCLOAK_HOSTNAME:-auth.example.com}"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD est requis en production}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-telecom}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-telecom_secret}
      KC_PROXY: edge
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    networks: [telecom-network]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${REGISTRY:-registry.example.com}/telecom-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-telecom}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-telecom_secret}
      DATABASE_NAME: ${POSTGRES_DB:-telecom_tickets}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://telecom:telecom_secret@postgres:5432/telecom_tickets}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST est requis en production}
      SMTP_PORT: ${SMTP_PORT:-587}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      AUTH_PROVIDER: ${AUTH_PROVIDER:-keycloak}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://auth.example.com/realms/telecom}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-https://auth.example.com/realms/telecom/protocol/openid-connect/certs}
      PUBLIC_SUPPORT_ORIGINS: ${PUBLIC_SUPPORT_ORIGINS:-https://portail.ticketing.example.com}
      PUBLIC_SUPPORT_CONTACT_HASH_SECRET: ${PUBLIC_SUPPORT_CONTACT_HASH_SECRET:?secret requis en production}
      PUBLIC_SUPPORT_MASTER_KEYS: ${PUBLIC_SUPPORT_MASTER_KEYS:?secret requis en production}
      PUBLIC_SUPPORT_MASTER_KEY_VERSION: ${PUBLIC_SUPPORT_MASTER_KEY_VERSION:-1}
      PUBLIC_SESSION_SECRET: ${PUBLIC_SESSION_SECRET:?secret requis en production}
      PUBLIC_WS_COOKIE_NAME: ${PUBLIC_WS_COOKIE_NAME:-__Host-support_session,__Host-support_iframe_session}
      PUBLIC_SUPPORT_BOT_PROVIDER: ${PUBLIC_SUPPORT_BOT_PROVIDER:-none}
      PUBLIC_SUPPORT_BOT_API_KEY: ${PUBLIC_SUPPORT_BOT_API_KEY:-}
      PUBLIC_SUPPORT_BOT_BASE_URL: ${PUBLIC_SUPPORT_BOT_BASE_URL:-}
      PUBLIC_SUPPORT_BOT_MODEL: ${PUBLIC_SUPPORT_BOT_MODEL:-}
      PUBLIC_SUPPORT_BOT_MAX_TOKENS: ${PUBLIC_SUPPORT_BOT_MAX_TOKENS:-800}
      PUBLIC_SUPPORT_BOT_TIMEOUT_MS: ${PUBLIC_SUPPORT_BOT_TIMEOUT_MS:-20000}
      PUBLIC_SUPPORT_BOT_DAILY_BUDGET: ${PUBLIC_SUPPORT_BOT_DAILY_BUDGET:-200}
      PUBLIC_SUPPORT_BOT_CIRCUIT_OPEN_AFTER: ${PUBLIC_SUPPORT_BOT_CIRCUIT_OPEN_AFTER:-5}
      PUBLIC_SUPPORT_BOT_CIRCUIT_OPEN_MS: ${PUBLIC_SUPPORT_BOT_CIRCUIT_OPEN_MS:-600000}
      PUBLIC_SUPPORT_BOT_PROMPT_VERSION: ${PUBLIC_SUPPORT_BOT_PROMPT_VERSION:-2026-08-v1}
      PUBLIC_SUPPORT_RETENTION_INACTIVE_DAYS: ${PUBLIC_SUPPORT_RETENTION_INACTIVE_DAYS:-395}
      APP_NAME: ${APP_NAME:-Helpdesk Telecom}
      APP_URL: ${APP_URL:-https://ticketing.example.com}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://ticketing.example.com/api/v1}
      LOGO_URL: ${LOGO_URL:-https://ticketing.example.com/logo.png}
      REPORT_DOWNLOAD_SECRET: ${REPORT_DOWNLOAD_SECRET:?secret requis en production}
      REPORT_DOWNLOAD_TTL_SECONDS: ${REPORT_DOWNLOAD_TTL_SECONDS:-604800}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      clamav:
        condition: service_healthy
    networks: [telecom-network]

  public-frontend:
    image: ${REGISTRY:-registry.example.com}/telecom-public-frontend:${TAG:-latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:3000
      PUBLIC_SUPPORT_INTEGRATION_KEY: ${PUBLIC_SUPPORT_INTEGRATION_KEY:?secret requis en production}
      PUBLIC_BFF_CSRF_SECRET: ${PUBLIC_BFF_CSRF_SECRET:?secret requis en production}
      PUBLIC_COOKIE_SECURE: 'true'
    networks: [telecom-network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${REGISTRY:-registry.example.com}/telecom-frontend:${TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://api:3000
      REDIS_URL: redis://redis:6379
      AUTH_PROVIDER: ${AUTH_PROVIDER:-keycloak}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://auth.example.com/realms/telecom}
      KEYCLOAK_INTERNAL_ISSUER: ${KEYCLOAK_INTERNAL_ISSUER:-https://auth.example.com/realms/telecom}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-telecom-frontend}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-https://ticketing.example.com/api/auth/keycloak/callback}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-https://ticketing.example.com}
      AUTH_COOKIE_SECURE: 'true'
      AUTH_CSRF_SECRET: ${AUTH_CSRF_SECRET:?AUTH_CSRF_SECRET est requis en production}
    expose:
      - '3000'
    depends_on:
      - api
      - redis
    networks: [telecom-network]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [api, frontend, public-frontend, keycloak]
    networks: [telecom-network]

volumes:
  postgres-data:
  redis-data:
  clamav-data:

networks:
  telecom-network:
    driver: bridge
